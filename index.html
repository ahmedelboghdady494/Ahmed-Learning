<!doctype html>

<title>Ahmed Academy | Grade 9 Advanced Math</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111827;
  --panel2:#172033;
  --line:#28364a;
  --text:#f8fafc;
  --muted:#9fb0c8;
  --accent:#38bdf8;
  --accent2:#2563eb;
  --good:#22c55e;
  --bad:#ef4444;
  --shadow:0 18px 60px rgba(0,0,0,.35)
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#13213c 0%,var(--bg) 42%);
  color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:inherit}

.container{
  width:min(1200px,calc(100% - 32px));
  margin:auto
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(11,18,32,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px
}

.brand{
  font-weight:900;
  letter-spacing:.2px
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px
}

.user-pill,.chip{
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#0f172a;
  color:var(--muted);
  font-size:13px
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:800;
  transition:.18s
}

.btn-primary{
  background:var(--accent2);
  color:#fff
}

.btn-primary:hover{
  filter:brightness(1.12)
}

.btn-ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line)
}

.btn-ghost:hover{
  background:#162033
}

.btn-small{
  padding:8px 11px;
  font-size:13px
}

.page{
  padding:34px 0 60px
}

.center{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px
}

.auth-card{
  width:min(470px,100%);
  background:rgba(17,24,39,.95);
  border:1px solid var(--line);
  border-radius:24px;
  padding:34px;
  box-shadow:var(--shadow)
}

.logo-mark{
  font-size:48px
}

.title{
  font-size:clamp(34px,6vw,58px);
  line-height:1.02;
  margin:10px 0
}

.subtitle{
  color:var(--muted);
  line-height:1.65
}

.form-row{
  margin-top:16px
}

.form-row label{
  display:block;
  margin:0 0 7px;
  font-weight:800
}

.input{
  width:100%;
  padding:13px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0c1423;
  color:#fff;
  outline:0
}

.input:focus{
  border-color:var(--accent)
}

.auth-error{
  min-height:22px;
  margin-top:10px;
  color:#fb7185
}

.auth-switch{
  margin-top:18px;
  color:var(--muted);
  text-align:center;
  font-size:14px
}

.link-btn{
  background:transparent;
  border:0;
  color:#7dd3fc;
  font-weight:800
}

.hero{
  padding:40px 0 30px;
  text-align:center
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid #1d4ed8;
  background:#10214a;
  color:#bfdbfe;

  font-size:13px;

.hero h1{

.hero h1 span{

.hero p{

  line-height:1.65

.term-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:28px
}

.card{
  background:rgba(17,24,39,.88);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.18)

.term-card{

.term-card:hover{

.term-icon{

}

.term-card h3{

.term-card p{

.term-card .btn{

.term-head{

  gap:16px;
  margin-bottom:22px
}

.term-head h2{
  font-size:40px;
  margin:0 0 7px
}

.term-head p{
  color:var(--muted);
  margin:0

.section-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);

.section-card{

.section-card:hover{

.section-card .ico{

.section-card h3{

.section-card p{

.content{

.content h2{

.content>.muted{

.muted{

.unit{

.unit-head{

.unit-head strong{

.unit-body{

.unit.open .unit-body{

.lesson-row{

.question{

.question h4{

.option{

  border:1px solid var(--line);
  border-radius:10px;
  margin:8px 0;

.option input{

.score-box{

  border-radius:15px;
  border:1px solid var(--line);
  background:#0d1625;
  margin:18px 0

.score-big{

.result-row{

  gap:12px;
  flex-wrap:wrap;

.good{color:var(--good)}

.progress-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px

.stat{
  padding:17px

.bar{
  height:10px;
  background:#1b2738;
  border-radius:999px;
  overflow:hidden

.bar>span{
  display:block;
  height:100%;
  background:var(--accent2)
}

.teacher-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.stat-box{
  padding:22px
}

.stat-num{
  font-size:35px;
  font-weight:900;
  margin-top:4px

.visitor-table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px

.visitor-table th,
.visitor-table td{
  padding:11px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px

.visitor-table th{
  color:#a9bad0
}

.admin-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0 4px

.notice{
  padding:13px 14px;
  border:1px dashed #48637f;
  border-radius:12px;
  color:var(--muted);
  background:#0d1624;
  line-height:1.5

.empty{

  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:14px

.lang-menu{
  position:relative

.lang-panel{
  position:absolute;
  right:0;
  top:45px;
  min-width:170px;
  background:#0d1625;
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  box-shadow:var(--shadow)

.lang-opt{
  width:100%;
  text-align:left;
  background:transparent;
  color:#fff;
  border:0;
  padding:10px;
  border-radius:9px

.lang-opt:hover{

footer{
  padding:30px 0;
  color:#6f829e;
  text-align:center;
  font-size:12px
}

@media (max-width:920px){
  .term-grid,
  .section-grid,
  .teacher-grid{
    grid-template-columns:1fr
  }

  .quiz-list,
  .challenge-list,
  .progress-grid{
    grid-template-columns:1fr
  }

  .term-head{
    flex-direction:column
  }

  .nav{
    align-items:flex-start;
    flex-direction:column;
    padding:12px 0
  }

  .nav-actions{
    width:100%;
    justify-content:flex-end
  }
}
</style>
</head>

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadState(){

  try{

    const saved =
      JSON.parse(localStorage.getItem(STORE_KEY));

    if(!saved){
      return clone(defaultState);
    }

    const merged = clone(defaultState);

    merged.students = saved.students || {};
    merged.currentUser = saved.currentUser || null;
    merged.currentRole = saved.currentRole || null;
    merged.visits = saved.visits || [];

    return merged;

  }catch(e){

    return clone(defaultState);

  }

}

  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}

function setLanguage(next){

  lang = next;

  localStorage.setItem(
    LANG_KEY,
    lang
  );

  document.documentElement.lang =
    lang === 'ar' ? 'ar' : 'en';

  document.documentElement.dir =
    lang === 'ar' ? 'rtl' : 'ltr';

  render();

}

function render(){

    lang === 'ar' ? 'ar' : 'en';

  document.documentElement.dir =
    lang === 'ar' ? 'rtl' : 'ltr';

  const app =
    document.getElementById('app');

  if(route.screen === 'login'){
    app.innerHTML = loginView();
    return;
  }

  if(route.screen === 'create'){
    app.innerHTML = createView();
    return;
  }

    app.innerHTML = teacherView();
    return;

    return;

    return;

  if(route.screen === 'quizRun'){
    app.innerHTML = runView(false);
    return;
  }

  if(route.screen === 'challengeRun'){
    app.innerHTML = runView(true);
    return;
  }

}

function keyFor(term,unit,lesson,mode,index){

  return `t${term}|${unit}|${lesson}|${mode}|${index}`;

}

function hash(str){

  let h=2166136261;

  for(let i=0;i<str.length;i++){

    h ^= str.charCodeAt(i);

    h=Math.imul(h,16777619);

  }

  return h>>>0;

}

function shuffle(arr,seed){

  let a=[...arr];
  let h=hash(seed);

  for(let i=a.length-1;i>0;i--){

    h=(Math.imul(h^i,16777619)>>>0);

    const j=h%(i+1);

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

function generateQuestions(
  term,
  unit,
  lesson,
  mode,
  index
){

  const qs=[];

  const seed =
    `${term}|${unit}|${lesson}|${mode}|${index}|${Date.now()}`;

  for(let i=1;i<=10;i++){

    const base =
      Math.abs(hash(seed+'|'+i))%40+1;

    const b =
      Math.abs(hash(seed+'|b|'+i))%20+2;

    let op;

    if(mode==='challenge'){

      op =
        i%3===0
          ? '×'
          : i%2===0
          ? '+'
          : '−';

    }else{

      op =
        i%2===0
          ? '+'
          : '−';

    }

    let answer;

    if(op==='+'){
      answer=base+b;
    }
    else if(op==='−'){
      answer=base-b;
    }
    else{
      answer=base*b;
    }

    let opts=[
      answer,
      answer+1,
      answer-2,
      answer+5
    ];

    opts=[...new Set(opts)];

    while(opts.length<4){

      opts.push(
        answer+opts.length+7
      );

    }

    opts=shuffle(
      opts,
      seed+'|o|'+i
    );

    qs.push({
      id:i,
      text:
        mode==='challenge'
        ? `Think carefully: ${base} ${op} ${b} = ?`
        : `Question ${i}: ${base} ${op} ${b} = ?`,
      options:opts,
      answer:answer
    });

  }

  return qs;

}

function submitSet(){

  let correct=0;

  route.questions.forEach(q=>{

    const el =
      document.querySelector(
        `input[name="q${q.id}"]:checked`
      );

    if(
      el &&
      Number(decodeURIComponent(el.value))
        === Number(q.answer)
    ){

      correct++;

    }

  });

  const total=10;

  const pct =
    Math.round(
      correct/total*100
    );

  const key =
    keyFor(
      route.term,
      route.unit,
      route.lesson,
      route.mode,
      route.index
    );

  const prog =
    progressStore(
      state.currentUser
    );

  prog[key]={
    term:route.term,
    unit:route.unit,
    lesson:route.lesson,
    mode:route.mode,
    index:route.index,
    correct,
    total,
    pct,
    updatedAt:now()
  };

  saveState();

  route.screen='term';

  route.section='progress';

  alert(
    `${tx('result')}: ${correct}/${total} = ${pct}%`
  );

  render();

}

              class="btn btn-ghost btn-small"
              onclick="clearStudentData()"
            >
              ${tx('reset')}
            </button>

          </div>

          ${
            studentNames.length

            ?

            `

            <table class="visitor-table">

              <thead>

                <tr>
                  <th>${tx('studentName')}</th>
                  <th>${tx('username')}</th>
                  <th>${tx('lastVisit')}</th>
                </tr>

              </thead>

              <tbody>

                ${
                  studentNames.map(n=>{

                    const s =
                      state.students[n];

                    return `

                      <tr>

                        <td>
                          ${esc(s.name||n)}
                        </td>

                        <td>
                          ${esc(n)}
                        </td>

                        <td>
                          ${esc(s.lastLogin||'—')}
                        </td>

                      </tr>

                    `;

                  }).join('')
                }

              </tbody>

            </table>

            `

            :

            `

            <div
              class="empty"
              style="margin-top:12px"
            >
              ${tx('noData')}
            </div>

            `

          }

          <h3 style="margin-top:26px">
            Recent Visits
          </h3>

          <table class="visitor-table">

            <thead>

              <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Time</th>
              </tr>

            </thead>

            <tbody>

              ${
                state.visits
                  .slice()
                  .reverse()
                  .slice(0,20)
                  .map(v=>`

                    <tr>

                      <td>
                        ${esc(v.username)}
                      </td>

                      <td>
                        ${esc(v.role)}
                      </td>

                      <td>
                        ${esc(v.time)}
                      </td>

                    </tr>

                  `).join('')
              }

            </tbody>

          </table>

        </div>

      </div>

    </main>

  `);

}

function studentLogin(){

  const u =
    document.getElementById('loginUser')
      .value
      .trim();

  const p =
    document.getElementById('loginPass')
      .value;

  if(!u || !p){

    document.getElementById('loginError')
      .textContent =
        tx('loginError');

    return;

  }

  const s =
    state.students[u];

  if(!s || s.password!==p){

    document.getElementById('loginError')
      .textContent =
        tx('loginError');

    return;

  }

  s.lastLogin=now();

  state.currentUser=u;
  state.currentRole='student';

  logVisit(u,'student');

  saveState();

  route.screen='home';

  render();

}

function createStudent(){

  const name =
    document.getElementById('newName')
      .value
      .trim();

  const u =
    document.getElementById('newUser')
      .value
      .trim();

  const p =
    document.getElementById('newPass')
      .value;

  const p2 =
    document.getElementById('newPass2')
      .value;

  const err =
    document.getElementById('createError');

  if(
    !name ||
    !u ||
    !p ||
    p!==p2
  ){

    err.textContent =
      tx('createError');

    return;

  }

  if(state.students[u]){

    err.textContent =
      tx('exists');

    return;

  }

  state.students[u]={
    name,
    password:p,
    createdAt:now(),
    lastLogin:now(),
    progress:{}
  };

  state.currentUser=u;
  state.currentRole='student';

  state.visits.push({
    username:u,
    role:'student',
    time:now()
  });

  saveState();

  route.screen='home';

  alert(
    tx('accountCreated')
  );

  render();

}

function teacherLogin(){

  const u =
    document.getElementById('teacherUser')
      .value
      .trim();

  const p =
    document.getElementById('teacherPass')
      .value;

  const e =
    document.getElementById('teacherError');

  if(
    u!==TEACHER.username ||
    p!==TEACHER.password
  ){

    e.textContent =
      tx('loginError');

    return;

  }

  state.currentUser='Ahmed';
  state.currentRole='teacher';

  logVisit(
    'Ahmed',
    'teacher'
  );

  saveState();

  route.screen='teacher';

  render();

}

function logout(){

  state.currentUser=null;
  state.currentRole=null;

  route={
    screen:'login',
    term:1,
    section:null,
    unit:null,
    lesson:null,
    mode:null,
    index:null,
    questions:[]
  };

  saveState();

  render();

}

function goHome(){

  route.screen='home';
  route.section=null;
  route.unit=null;
  route.lesson=null;

  render();

}

function openTerm(t){

  route.term=t;
  route.section=null;
  route.unit=null;
  route.lesson=null;
  route.screen='term';

  render();

}

function openSection(s){

  route.section=s;
  route.unit=null;
  route.lesson=null;
  route.screen='term';

  render();

}

function openLesson(unit,lesson){

  route.unit=
    decodeURIComponent(unit);

  route.lesson=
    decodeURIComponent(lesson);

  route.section='lessons';
  route.screen='lesson';

  render();

}

function toggleLang(){

  const panel =
    document.getElementById('langPanel');

  if(panel){
    panel.classList.toggle('hidden');
  }

}

function downloadState(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          state,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  const a =
    document.createElement('a');

  a.href =
    URL.createObjectURL(blob);

  a.download =
    'ahmed-academy-data.json';

  a.click();

  URL.revokeObjectURL(a.href);

}

function clearStudentData(){

  if(
    confirm(
      'Clear all local student accounts and progress?'
    )
  ){

    state.students={};
    state.visits=[];

    saveState();

    render();

  }

}

window.addEventListener(
  'click',
  e=>{

    if(!e.target.closest('.lang-menu')){

      document
        .getElementById('langPanel')
        ?.classList
        .add('hidden');

    }

  }
);

/*
  Add teacher screen to renderer.
*/

const oldRender = render;

render = function(){

  document.documentElement.lang =
    lang === 'ar'
      ? 'ar'
      : 'en';

  document.documentElement.dir =
    lang === 'ar'
      ? 'rtl'
      : 'ltr';

  const app =
    document.getElementById('app');

  if(route.screen==='teacherLogin'){

    app.innerHTML =
      teacherLoginView();

    return;

  }

  oldRender();

};

if(
  state.currentRole==='teacher'
){

  route.screen='teacher';

}

else if(
  state.currentRole==='student' &&
  state.currentUser
){

  route.screen='home';

}

else{

  state.currentUser=null;
  state.currentRole=null;

  route.screen='login';

}

render();

</script>

</body>
</html>
